<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikSnap Ultra Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-10">

    <div class="max-w-md mx-auto pt-8 px-4">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-2xl font-black text-gray-900">TikSnap Ultra</h1>
            <p class="text-gray-500 text-sm">Professional Downloader</p>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-6">
            <input type="text" id="urlInput" placeholder="TikTok လင့်ခ်ကို ကူးထည့်ပါ..." 
                class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-400 transition-all mb-4 text-sm">
            <button id="mainBtn" onclick="handleDownload()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">
                ဒေတာ ရယူမည်
            </button>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="hidden space-y-6">
            <!-- Author Profile -->
            <div class="flex items-center gap-4 bg-white p-4 rounded-3xl shadow-sm">
                <img id="avatar" class="w-14 h-14 rounded-2xl border border-gray-100 shadow-inner">
                <div>
                    <h3 id="nickname" class="font-bold text-gray-900"></h3>
                    <p class="text-xs text-gray-400">TikTok Creator</p>
                </div>
            </div>

            <!-- Video Section -->
            <div id="videoSection" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">Video File</span>
                    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full">HD Quality</span>
                </div>
                <button onclick="triggerDownload(currentVideoUrl, 'tiktok_video.mp4')" 
                    class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-green-100">
                    ဗီဒီယို ဒေါင်းလုဒ်လုပ်မည်
                </button>
            </div>

            <!-- Horizontal Photos Grid -->
            <div id="photoSection" class="hidden">
                <h2 class="font-bold mb-4 text-sm text-gray-700">Slide Photos</h2>
                <div id="photosGrid" class="flex overflow-x-auto gap-4 no-scrollbar"></div>
            </div>
        </div>
    </div>

    <script>
        let currentVideoUrl = '';

        async function handleDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('mainBtn');
            if (!urlInput) return alert('လင့်ခ် ထည့်ပါ');

            btn.innerText = 'ရှာဖွေနေသည်...';
            btn.disabled = true;

            try {
                // API Request (HD version)
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                const resData = await res.json();
                
                if (resData.code === 0) {
                    const data = resData.data;
                    document.getElementById('resultContainer').classList.remove('hidden');
                    document.getElementById('avatar').src = data.author.avatar;
                    document.getElementById('nickname').innerText = data.author.nickname;

                    // Reset Sections
                    document.getElementById('videoSection').classList.add('hidden');
                    document.getElementById('photoSection').classList.add('hidden');

                    // Handle Video
                    if (data.play) {
                        currentVideoUrl = data.play;
                        document.getElementById('videoSection').classList.remove('hidden');
                    }

                    // Handle Photos
                    if (data.images) {
                        document.getElementById('photoSection').classList.remove('hidden');
                        const grid = document.getElementById('photosGrid');
                        grid.innerHTML = '';
                        data.images.forEach((img, i) => {
                            grid.innerHTML += `
                                <div class="min-w-[160px] bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                                    <img src="${img}" class="w-full h-40 object-cover rounded-xl mb-3">
                                    <button onclick="triggerDownload('${img}', 'slide_${i+1}.jpg')" class="w-full bg-blue-500 text-white text-xs font-bold py-3 rounded-xl">ဒေါင်းလုဒ်</button>
                                </div>`;
                        });
                    }
                } else {
                    alert('မှားယွင်းနေပါသည်။ လင့်ခ်စစ်ဆေးပါ။');
                }
            } catch (e) {
                alert('ချိတ်ဆက်မှု ပြဿနာရှိနေသည်။');
            } finally {
                btn.innerText = 'ဒေတာ ရယူမည်';
                btn.disabled = false;
            }
        }

        // Logic အပြည့်အစုံပါသည့် Download Trigger
        function triggerDownload(url, filename) {
            // Android WebView ရှိ DownloadListener ကို Trigger လုပ်ပေးမည့် Logic
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
