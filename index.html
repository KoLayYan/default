<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikSnap Ultra Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-10">

    <div class="max-w-md mx-auto pt-8 px-4">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-black text-gray-900">TikSnap Ultra</h1>
            <p class="text-gray-500 text-sm">Light Mode UI - Direct Download</p>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-6">
            <input type="text" id="urlInput" placeholder="TikTok လင့်ခ်ကို ကူးထည့်ပါ..." 
                class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-400 transition-all mb-4 text-sm">
            <button id="mainBtn" onclick="handleDownload()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all cursor-pointer">
                ဒေတာ ရယူမည်
            </button>
        </div>

        <!-- Loading State -->
        <div id="loader" class="hidden text-center py-8">
            <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-2"></div>
            <p class="text-xs text-gray-400 font-medium">အချက်အလက်များကို ရယူနေပါပြီ...</p>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="hidden space-y-6">
            <!-- Author Profile -->
            <div class="flex items-center gap-4 bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
                <img id="avatar" class="w-14 h-14 rounded-2xl border border-gray-100 shadow-inner object-cover">
                <div>
                    <h3 id="nickname" class="font-bold text-gray-900"></h3>
                    <p class="text-xs text-gray-400">TikTok Creator</p>
                </div>
            </div>

            <!-- Video Section (No Preview, Direct Download) -->
            <div id="videoSection" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">VIDEO FILE</span>
                    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">HD Quality</span>
                </div>
                <button onclick="triggerDirectDownload(currentVideoUrl, 'tiktok_video_' + Date.now() + '.mp4')" 
                    class="w-full bg-green-600 hover:bg-green-500 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-green-100 flex items-center justify-center space-x-2 cursor-pointer">
                    <span>ဗီဒီယို ဒေါင်းလုဒ်လုပ်မည်</span>
                </button>
            </div>

            <!-- Horizontal Photos Grid (Slide Photos) -->
            <div id="photoSection" class="hidden space-y-3">
                <h2 class="font-bold text-sm text-gray-700 px-1">Slide Photos</h2>
                <div id="photosGrid" class="flex overflow-x-auto gap-4 no-scrollbar pb-2"></div>
            </div>
        </div>
    </div>

    <script>
        let currentVideoUrl = '';

        async function handleDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('mainBtn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            
            if (!urlInput) {
                alert('ကျေးဇူးပြု၍ TikTok လင့်ခ် ထည့်သွင်းပါ။');
                return;
            }

            loader.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            document.getElementById('videoSection').classList.add('hidden');
            document.getElementById('photoSection').classList.add('hidden');

            btn.disabled = true;

            try {
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                const resData = await res.json();
                
                loader.classList.add('hidden');
                btn.disabled = false;

                if (resData.code === 0 && resData.data) {
                    const data = resData.data;
                    resultContainer.classList.remove('hidden');
                    
                    document.getElementById('avatar').src = data.author?.avatar || '';
                    document.getElementById('nickname').innerText = data.author?.nickname || 'TikTok User';

                    // Video Check
                    if (data.play) {
                        currentVideoUrl = data.play;
                        document.getElementById('videoSection').classList.remove('hidden');
                    }

                    // Photos Slide Check (Horizontal Gridview)
                    if (data.images && data.images.length > 0) {
                        document.getElementById('photoSection').classList.remove('hidden');
                        const grid = document.getElementById('photosGrid');
                        grid.innerHTML = '';
                        
                        data.images.forEach((imgUrl, i) => {
                            grid.innerHTML += `
                                <div class="min-w-[170px] bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                                    <div class="w-full h-44 rounded-xl overflow-hidden bg-gray-100 mb-3">
                                        <img src="${imgUrl}" class="w-full h-full object-cover">
                                    </div>
                                    <button onclick="triggerDirectDownload('${imgUrl}', 'tiktok_photo_${i+1}_${Date.now()}.jpg')" 
                                        class="w-full bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-3 rounded-xl transition-all cursor-pointer active:scale-95">
                                        ဒေါင်းလုဒ်
                                    </button>
                                </div>`;
                        });
                    }
                } else {
                    alert('အချက်အလက် ရယူ၍မရပါ။ လင့်ခ်မှန်ကန်မှု ရှိမရှိ စစ်ဆေးပါ။');
                }
            } catch (e) {
                loader.classList.add('hidden');
                btn.disabled = false;
                alert('ချိတ်ဆက်မှု အမှားအယွင်း ရှိပါသည်။ နောက်တစ်ကြိမ် ထပ်ကြိုးစားပါ။');
            }
        }

        // Preview လုံးဝမပြဘဲ Sketchware DownloadListener သို့ တိုက်ရိုက်ပို့ပေးမည့် Function
        function triggerDirectDownload(fileUrl, filename) {
            const a = document.createElement('a');
            a.href = fileUrl;
            a.setAttribute('download', filename);
            a.setAttribute('target', '_blank');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
